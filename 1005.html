<html>
    <head>
        <title>1005-CSS容器設定</title>
        <style>
            /*
            容器 BOX
            box-sizing:預設是content-box 也可以改成border-box
            由內而外是 content內容(寬高)//padding填充//border框線//margin邊界
            除了內容 分別可以設定 上top 右right 下bottom 左left
            框線再分 粗細(witdh) 樣式(style) 顏色(color)
            框線樣式常有四種 solid實線 dashed虛線 dotted點點 double雙線
            tranparent 透明
            border-radius(圓角矩形的半徑)
            */
            #d1{
                width:100px;
                height:100px;
                background-color:rgb(14, 119, 218);
                border:5px solid black;
                /*border-color: red yellow green blue;
                border-width: 10px;*/
                padding:10px 50px 30px;
                margin-bottom:10px;
            }
            #d2{
                border:1px solid black;
                height:200px;
                width:400px;
                margin:20px;
                border-radius:50px;/*絕對單位*/
            }
            #d3{
                border:1px solid black;
                height:100px;
                width:200px;
                margin:20px;
                border-radius:50%;/*相對單位*/
            }
            #d4{
                border:50px solid black;
                height:0px;
                width:0px;
                margin:20px;
                border-color:red yellow green rgb(12, 12, 80);
                border-width: 10px 0px 60px 80px;
            }
            #d6{
                border:100px solid transparent;
                border-bottom-color:red;
                border-top-width: 0;
            }
            #d5{
                height:0px;
                width:0px;
                border:55px solid transparent;
                margin:10px;
                border-top-color:red;
                border-bottom-width: 0;
            }
        </style>
    </head>
    <body>
        <div id="d1">67</div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
        <div id="d5"></div>
        <div id="d6"></div>
        <hr>

        <hr>

    </body>
</html>
