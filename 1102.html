<!DOCTYPE html>
<html>
    <head>
        <title>1102-javascript輸入與輸出</title>
        <style>
            /*css的註解*/
            #ans{
                width: 300px;
                height: 100px;
                background-color: gray;
            }
        </style>
        <script>
            /*js javascript 多行註解*/
            //JS單行註解
            function say(){
                name=prompt("請問你的名字是?");
                if(confirm("你確定你叫"+name+"ㄇ?")){
                    alert("你好，"+name);
                }else{
                    alert("請重新打招呼!");
                }
                /*問問題並回答 得到字串的答案
                /*console.log("abc");
                //alert("你好");
                ans=prompt("你叫甚麼名字?");
                console.log(ans+"是"+typeof(ans)+"類型的");
                //得到兩種結果:string/null(object)
                //string包含內容的空字串和字串
                alert(ans); */
                /*confirm("你確定嗎");
                console.log(ans+"是"+typeof(ans)+"類型的");*/
                //得到兩種結果:true flase
                document.getElementById("ans").innerHTML="Hello";
            }
            function setVol(){
                document.getElementById("Vol_num").innerHTML=document.getElementById("Vol_range").value;
            }
            function setBGcolor(){
                document.getElementById("ans").style.backgroundColor=document.getElementById("bgcolor").value;
            }
            function add(){
                n1=parseInt(document.getElementById("n1").value); //parseInt字串轉整數 原程式一律視為字串
                n2=parseInt(document.getElementById("n2").value);
                document.getElementById("add_ans").innerHTML=(n1+n2);
            }
            function ready(){
                setVol();
            }
        </script>
    </head>
    <body onload="ready();">
        <button onclick="say()">打招呼</button>
        <div id="ans"></div>
        <hr>
        <input type="text" value="text"><br>
        <input type="password" value="password"><br>
        <input type="number" value="123"><br>
        <input type="date" value="2026-11-02"><br>
        <input type="datetime-local" value="2026-11-02T08:57:21"><br>
        <input type="color" value="#FF0000" id="bgcolor" onchange="setBGcolor();"><br>
        <input type="range" id="vol_range" min="1" max="100" value="50" oninput="setVol();"><span id="vol_num"></span>
        <hr>
        <input type="number" id="n1"> + <input type="number" id="n2" ><button onclick="add()">等於</button><span id="add_ans"></span>
    </body>
</html>
