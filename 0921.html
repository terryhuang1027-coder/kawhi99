<html>
    <head>
        <title>0921-CSS簡介</title>
        <!--html的註解-->
        <style>/* CSS的註解*/
        /*CSS又稱樣式表*/
        /*display: block inline inlineblock
          width:px;pixal像素
          height:px;
          color前景顏色
          background:背景顏色
          顏色的設定方法:
          1.英文單字
                  red  green blue
          2.rgba(0~255,0~255,0~255,0~1)
          3.rgb(0~255,0~255,0~255)
          4.色碼 #RRGGBB 00~FF
          5.hsl(色相0~360,彩度0~100%,亮度0~100%)
          6.hsla(色相0~360,彩度0~100%,亮度0~100%,透明度0~1%)
        */
        p{
            background-color:rgb(214, 92, 21);
        }
        #p1 {
            background-color:rgb(0, 17, 255);
        }
        #cl{
            color:aqua;
        }
        #d1{
            background-color: hsl(20,60%,62%);
            height:500px;
            width:500px;
        }
        </style>
    </head>
    <body>
        <p id ="p1" class="cl">第一個段落<br>123</p>
        <p>第二個段落</p>
        <p class="cl">第三個段落</p>
        <div id="d1" class="dc1">1</div>
        <div class="dc1">1</div>
    </body>

</html>
